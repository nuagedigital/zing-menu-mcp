<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automation complete &middot; Email Extractor</title>
  <style>
    :root{
      --purple:#cb3bfd;
      --ink:#0f172a;
      --muted:#334155;
      --sub:#64748b;
      --line:#e5e7eb;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(180deg,#faf5ff 0%,#f1f5f9 100%);
      display:flex;align-items:center;justify-content:center;
      padding:24px;color:var(--ink);
    }
    .card{
      width:100%;max-width:560px;background:#fff;border:1px solid var(--line);
      border-radius:20px;padding:32px;box-shadow:0 25px 60px rgba(0,0,0,.12);
    }
    .head{display:flex;align-items:center;gap:18px;margin-bottom:22px;}
    .check{
      width:72px;height:72px;border-radius:50%;background:#ecfdf5;color:#10b981;
      display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1;flex:none;
    }
    h1{font-size:30px;margin:0;font-weight:800;}
    .line{font-size:18px;color:var(--muted);margin:0 0 12px;}
    .line strong{color:var(--ink);}
    .sub{font-size:14px;color:var(--sub);margin:16px 0 26px;}
    .btn{
      display:block;width:100%;text-align:center;border-radius:14px;padding:16px 18px;
      font-size:17px;font-weight:700;cursor:pointer;border:1px solid transparent;
      margin-top:12px;transition:filter .15s ease;
    }
    .btn:hover{filter:brightness(0.97);}
    .btn.primary{background:var(--purple);border-color:var(--purple);color:#fff;}
    .btn.ghost{background:#f5f5f5;border-color:var(--line);color:#111;font-weight:600;font-size:15px;}
    .hint{font-size:12px;color:var(--sub);text-align:center;margin-top:16px;}
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="check">&#10003;</div>
      <h1>All done!</h1>
    </div>
    <p class="line">&#9993;&#65039; <strong id="emails">0</strong> emails collected during this run.</p>
    <p class="line">&#127760; <strong id="sites">0</strong> pages scanned.</p>
    <p class="sub">These emails are also saved to your cloud. The button below downloads only the emails found in this run.</p>

    <button id="download" class="btn primary">&#11015; Download this run's emails</button>
    <button id="close" class="btn ghost">Close this window</button>
    <p class="hint">You can also reopen the extension and go to the Automate tab anytime.</p>
  </div>
  <script src="complete.js"></script>
</body>
</html>
