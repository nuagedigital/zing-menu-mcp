name: Zingster Menu Scraper

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install patchright
          python -m patchright install chromium

      - name: Run scraper
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_SECRET: ${{ secrets.WP_SECRET }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          MIN_ITEMS_PER_LOCATION: '20'
          CF_WAIT_SECONDS: '60'
          KILL_CHROME: '1'
        run: python -X utf8 scrape_toast.py

      - name: Commit and push menu data (updates Vercel)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/toast-menu.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update menu data [skip ci]"
            git push
            echo "Pushed to GitHub — Vercel will auto-deploy"
          fi

      - name: Save JSON output (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toast-menu-json
          path: data/toast-menu.json
          if-no-files-found: ignore
          retention-days: 30
